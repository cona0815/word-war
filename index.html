<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word War</title>
  <style>
    :root {
      --ink:#ecfbff; --muted:rgba(236,251,255,.72); --panel:rgba(4,18,28,.82);
      --line:rgba(101,239,255,.32); --cyan:#65efff; --gold:#ffd86e;
      --green:#43c58c; --red:#ff735d; --orange:#ffb45e;
      font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%}
    body{color:var(--ink);background:#07131e;overflow:hidden}
    button,input{font:inherit} button{cursor:pointer;border:0}.hidden{display:none!important}
    .screen{position:fixed;inset:0;overflow:hidden}
    #loginScreen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px) minmax(0,1fr);grid-template-rows:minmax(min-content,1fr);gap:16px;align-items:center;padding:24px;height:100dvh;overflow:auto;background:linear-gradient(90deg,rgba(2,8,14,.55),rgba(2,8,14,.25),rgba(2,8,14,.55)),url("assets/login-castle.png") center/cover no-repeat}
    #loginScreen .login-hero{position:static;display:block;grid-row:1;align-self:end;width:100%;height:min(84dvh,820px);min-width:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));pointer-events:none}
    #loginScreen .login-hero.female{grid-column:1}#loginScreen .login-hero.male{grid-column:3}
    .login-card{position:relative;grid-column:2;grid-row:1;min-width:0;width:100%;padding:22px;border:1px solid transparent;border-radius:8px;background:transparent;box-shadow:none}
    .logo{display:block;width:min(320px,100%);height:auto;margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
    h1{margin:0 0 8px;text-align:center;color:#fff2a8;font-size:36px}.login-card p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:18px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .btn,.tab,.seg{min-height:46px;border-radius:8px;color:var(--ink);font-weight:900;border:1px solid rgba(101,239,255,.34);background:rgba(4,20,32,.78)}
    .tab.active,.seg.active{color:#07131e;background:linear-gradient(180deg,#78f2ff,#ffd86e);border-color:transparent}
    .primary{color:#07131e;background:linear-gradient(180deg,#ffe883,#f1b62f);box-shadow:0 12px 24px rgba(255,216,110,.18)}
    .panel{min-height:238px;padding:16px;border:1px solid rgba(101,239,255,.22);border-radius:8px;background:rgba(0,0,0,.18)}
    .form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.actions{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;margin-top:18px}
    label{display:grid;gap:7px;color:#fff1aa;font-weight:900}input{height:52px;padding:0 14px;color:white;border:1px solid rgba(255,216,110,.38);border-radius:8px;outline:0;background:rgba(2,11,20,.72)}
    .list{margin:0;padding-left:24px;color:var(--muted);line-height:1.8}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(101,239,255,.16);color:var(--muted)}
    .menu-btn{position:fixed;z-index:50;top:14px;right:14px;width:82px;height:48px;border-radius:8px;color:var(--ink);font-weight:900;border:1px solid var(--line);background:rgba(5,20,30,.9)}
    .game{background:#06101a}.stage-bg{position:absolute;inset:0;background-image:var(--stage-bg);background-size:var(--stage-size,cover);background-position:var(--stage-pos,center center);background-repeat:no-repeat;filter:saturate(1.04) brightness(.86);transform:scale(var(--stage-scale,1))}
    .game:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 62%,transparent 0 28%,rgba(0,0,0,.2) 68%),linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.25))}
    .hud{position:absolute;z-index:5;top:8px;left:8px;display:flex;gap:6px;align-items:stretch}.hud-card{min-width:74px;min-height:42px;padding:5px 8px;border:1px solid rgba(101,239,255,.28);border-radius:7px;background:linear-gradient(180deg,rgba(4,18,28,.74),rgba(4,18,28,.52));box-shadow:inset 0 0 14px rgba(101,239,255,.06),0 10px 24px rgba(0,0,0,.16);backdrop-filter:blur(5px)}
    .hud-card.level{min-width:218px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hud-label{display:block;color:var(--muted);font-size:11px;font-weight:900}.hud-value{display:block;margin-top:0;color:white;font-size:20px;line-height:1.05;font-weight:900}.hud-title{font-size:17px;font-weight:900;white-space:nowrap}.hud-round{color:var(--muted);font-size:13px;font-weight:900;white-space:nowrap}
    .hero{position:absolute;z-index:4;left:var(--hero-x,50%);top:var(--hero-y,58%);width:min(15vw,210px);aspect-ratio:1/1;transform:translate(-50%,-50%) scaleX(var(--hero-face,1));background-color:transparent;background-image:var(--hero-atlas);background-size:var(--hero-bg-size,400% 400%);background-repeat:no-repeat;background-position:var(--hero-bg-position,0 0);filter:drop-shadow(0 18px 20px rgba(0,0,0,.38))}
    /* Weapon art is baked into integrated hero PNGs. Never render a second weapon layer. */
    .hero-weapon{display:none}
    /* Gear is an effect-only layer. Weapon silhouettes remain exclusively in the integrated hero PNG. */
    .hero-gear{position:absolute;z-index:3;left:var(--hero-x,50%);top:var(--hero-y,58%);width:min(18vw,245px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 0 16px var(--gear-color,#65efff));opacity:.9}
    .hero-gear:before,.hero-gear:after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid color-mix(in srgb,var(--gear-color,#65efff) 64%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--gear-color,#65efff) 42%,transparent),inset 0 0 18px color-mix(in srgb,var(--gear-color,#65efff) 18%,transparent);animation:heroGearPulse 1.8s ease-in-out infinite}
    .hero-gear:after{inset:1%;border-width:1px;border-top-color:transparent;border-bottom-color:transparent;animation:heroGearOrbit 4.8s linear infinite}
    .hero-gear[data-gear="focus"]{--gear-color:#65efff}
    .hero-gear[data-gear="guardian"]{--gear-color:#ffd86e}
    .hero-gear[data-gear="guardian"]:before{inset:18% 21% 7%;border-radius:48% 48% 54% 54%;border-width:3px;clip-path:polygon(50% 0,92% 18%,82% 76%,50% 100%,18% 76%,8% 18%)}
    .hero-gear[data-gear="combo"]{--gear-color:#b06cff}
    .hero-gear[data-gear="combo"]:before{inset:12%;border-style:dashed;border-width:3px;animation:heroGearSpin 4s linear infinite}
    .hero-gear[data-gear="combo"]:after{border-left-color:#65efff;border-right-color:#65efff}
    .hero-gear[data-gear="crown"]{--gear-color:#ffe66d}
    .hero-gear[data-gear="crown"]:before{inset:8% 19% 62%;border-radius:5px 5px 45% 45%;border-width:3px;clip-path:polygon(0 100%,0 32%,24% 60%,50% 0,76% 60%,100% 32%,100% 100%)}
    .hero-gear[data-gear="crown"]:after{inset:20%;border-top-color:#fff2a8;border-bottom-color:transparent}
    @keyframes heroGearPulse{0%,100%{opacity:.38;transform:scale(.93)}50%{opacity:.8;transform:scale(1.04)}}
    @keyframes heroGearOrbit{to{transform:rotate(360deg)}}
    @keyframes heroGearSpin{to{transform:rotate(-360deg)}}
    .hero.integrated{aspect-ratio:768/648;background-size:100% 100%;background-position:center bottom;transform-origin:center bottom;will-change:transform;animation:heroIntegratedIdle 1.8s ease-in-out infinite}
    .hero.integrated.casting{animation:heroIntegratedCast 1.05s cubic-bezier(.2,.75,.25,1) 1 both}
    .hero.integrated.pose-sheet{width:min(17.5vw,245px);aspect-ratio:896/648;background-size:600% 100%;background-position:0 0;animation:none}
    .hero-motion-sprite{display:none;position:absolute;z-index:5;left:var(--hero-x,50%);top:var(--hero-y,58%);width:min(15vw,210px);aspect-ratio:1;background:var(--motion-frame) center/contain no-repeat;filter:drop-shadow(0 18px 20px rgba(0,0,0,.38));transform:translate(-50%,-50%) scaleX(var(--hero-face,1));pointer-events:none}
    .hero-motion-sprite.playing{display:block}
    .hero.motion-hidden{visibility:hidden}
    @keyframes heroIntegratedIdle{0%,100%{transform:translate(-50%,-50%) scaleX(var(--hero-face,1)) rotate(0deg)}25%{transform:translate(-50%,-51.2%) scaleX(var(--hero-face,1)) rotate(-.7deg)}50%{transform:translate(-50%,-52%) scaleX(var(--hero-face,1)) scale(1.018) rotate(0deg)}75%{transform:translate(-50%,-50.8%) scaleX(var(--hero-face,1)) rotate(.7deg)}}
    @keyframes heroIntegratedCast{0%{transform:translate(-50%,-50%) scaleX(var(--hero-face,1)) rotate(0deg)}18%{transform:translate(-50%,-52%) scaleX(var(--hero-face,1)) scale(.97) rotate(-2deg)}42%{transform:translate(-50%,-55%) scaleX(var(--hero-face,1)) scale(1.035) rotate(2deg)}66%{transform:translate(-50%,-48%) scaleX(var(--hero-face,1)) scale(1.075) rotate(-1deg)}82%{transform:translate(-50%,-51%) scaleX(var(--hero-face,1)) scale(1.025) rotate(0deg)}100%{transform:translate(-50%,-50%) scaleX(var(--hero-face,1)) scale(1) rotate(0deg)}}
    .hero.casting{animation:heroCast .46s steps(1,end) 1}@keyframes heroCast{0%,18%{background-position:0 0}19%,45%{background-position:0 33.333333%}46%,78%{background-position:0 66.666667%}79%,100%{background-position:0 100%}}
    .aura{position:absolute;z-index:3;left:var(--hero-x,50%);top:var(--hero-y,58%);width:min(17vw,250px);aspect-ratio:1/.42;transform:translate(-50%,38%);border:2px solid rgba(101,239,255,.35);border-radius:50%;box-shadow:0 0 42px rgba(101,239,255,.25),inset 0 0 28px rgba(101,239,255,.14)}
    .enemy{position:absolute;z-index:4;left:var(--x);top:var(--y);width:var(--size,112px);transform:translate(-50%,-50%);transition:transform .18s,opacity .2s}.enemy.defeated{opacity:0;transform:translate(-50%,-50%) scale(.5)}.enemy img{width:100%;display:block;filter:drop-shadow(0 13px 14px rgba(0,0,0,.4))}
    .tag,.boss-tag{position:absolute;left:50%;top:-32px;min-width:76px;width:max-content;max-width:min(520px,54vw);padding:5px 12px;transform:translateX(-50%);text-align:center;writing-mode:horizontal-tb;text-orientation:mixed;white-space:nowrap;word-break:keep-all;overflow-wrap:normal;color:var(--cyan);font-size:24px;line-height:1.1;font-weight:900;border:1px solid rgba(101,239,255,.38);border-radius:7px;background:rgba(3,17,26,.82);text-shadow:0 0 10px rgba(101,239,255,.8)}
    .tag.long{top:-46px;max-width:min(640px,62vw);font-size:18px;line-height:1.18;white-space:normal;overflow-wrap:normal;word-break:keep-all;text-wrap:balance}
    .zh-tone{display:inline-flex;align-items:flex-start;gap:1px}.zh-tone .tone-mark{font-size:.58em;line-height:1;margin-left:1px;transform:translateY(-.32em)}
    .order{display:none}
    .projectile{position:absolute;z-index:8;left:var(--sx);top:var(--sy);width:var(--fx-size,28px);height:var(--fx-size,28px);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,white 0 18%,var(--fx-core,#fff2a8) 19% 34%,var(--fx-a,#65efff) 35% 58%,transparent 60%);box-shadow:0 0 20px var(--fx-a,#65efff),0 0 46px var(--fx-b,rgba(101,239,255,.68));animation:fly var(--fx-time,.46s) cubic-bezier(.2,.78,.22,1) forwards}.projectile:before,.projectile:after{content:"";position:absolute;inset:42% -170%;height:16%;border-radius:99px;background:linear-gradient(90deg,transparent,var(--fx-a,#65efff),white,var(--fx-c,#ffd86e),transparent);filter:blur(.4px);transform:rotate(var(--fx-angle,0deg));opacity:.82}.projectile:after{inset:15% -115%;height:70%;border:1px solid var(--fx-c,#ffd86e);background:transparent;opacity:.48}.projectile.combo{width:var(--fx-size,44px);height:var(--fx-size,44px);box-shadow:0 0 26px white,0 0 70px var(--fx-a,#65efff),0 0 120px var(--fx-c,#ffd86e)}.projectile.combo:before{inset:44% -260%;height:22%;filter:blur(1px);opacity:.95}.projectile.combo:after{inset:-30% -180%;height:160%;border-width:2px;opacity:.65}@keyframes fly{to{left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) scale(1.25);opacity:.9}}
    .impact{position:absolute;z-index:9;left:var(--tx);top:var(--ty);width:var(--impact-size,82px);height:var(--impact-size,82px);border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,white 0 8%,var(--fx-core,#fff2a8) 9% 18%,var(--fx-a,#65efff) 19% 40%,transparent 43%),conic-gradient(from 0deg,transparent,var(--fx-c,#ffd86e),transparent,var(--fx-a,#65efff),transparent);box-shadow:0 0 32px var(--fx-a,#65efff),0 0 74px var(--fx-b,rgba(101,239,255,.58));animation:pop var(--impact-time,.42s) ease-out forwards;pointer-events:none}.impact.combo{width:var(--impact-size,142px);height:var(--impact-size,142px);box-shadow:0 0 42px white,0 0 110px var(--fx-a,#65efff),0 0 160px var(--fx-c,#ffd86e)}.combo-ring{position:absolute;z-index:7;left:var(--sx);top:var(--sy);width:var(--ring-size,168px);height:var(--ring-size,168px);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,transparent 0 43%,var(--fx-a,#65efff) 44% 46%,transparent 47% 54%,var(--fx-c,#ffd86e) 55% 57%,transparent 58%),conic-gradient(from 30deg,transparent,var(--fx-a,#65efff),transparent,var(--fx-c,#ffd86e),transparent);filter:drop-shadow(0 0 18px var(--fx-a,#65efff));animation:ringBurst .72s ease-out forwards}.combo-callout{position:absolute;z-index:10;left:var(--sx);top:calc(var(--sy) - 12%);transform:translate(-50%,-50%);padding:7px 18px;border:1px solid rgba(255,216,110,.72);border-radius:8px;color:#fff2a8;font-size:24px;font-weight:900;background:rgba(4,18,28,.82);text-shadow:0 0 12px var(--fx-a,#65efff);box-shadow:0 0 26px rgba(255,216,110,.22);animation:callout .72s ease-out forwards;pointer-events:none}@keyframes pop{from{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:1}to{transform:translate(-50%,-50%) scale(1.85) rotate(36deg);opacity:0}}@keyframes ringBurst{from{transform:translate(-50%,-50%) scale(.45) rotate(0deg);opacity:.95}to{transform:translate(-50%,-50%) scale(1.7) rotate(120deg);opacity:0}}@keyframes callout{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}18%,72%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-85%) scale(1.08)}}
    .sprite-fx{position:absolute;z-index:11;left:var(--sx);top:var(--sy);width:var(--sprite-size,142px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;animation:spriteTravel var(--fx-time,.72s) cubic-bezier(.18,.78,.18,1) forwards;filter:drop-shadow(0 0 16px var(--fx-a,#65efff)) drop-shadow(0 0 34px var(--fx-c,#ffd86e))}.sprite-fx-cell{width:100%;height:100%;background-image:var(--sprite-sheet);background-size:200% 200%;background-repeat:no-repeat;background-position:0 0;animation:spriteFrame var(--fx-time,.72s) steps(1,end) forwards}.sprite-fx.impact-only{left:var(--tx);top:var(--ty);animation:spriteImpact .48s ease-out forwards}.sprite-fx.impact-only .sprite-fx-cell{background-position:100% 100%;animation:none}@keyframes spriteTravel{0%{left:var(--sx);top:var(--sy);opacity:0;transform:translate(-50%,-50%) scale(.66)}16%{opacity:1;transform:translate(-50%,-50%) scale(.92)}70%{left:var(--tx);top:var(--ty);opacity:1;transform:translate(-50%,-50%) scale(1.06)}100%{left:var(--tx);top:var(--ty);opacity:0;transform:translate(-50%,-50%) scale(1.22)}}@keyframes spriteFrame{0%,24%{background-position:0 0}25%,54%{background-position:100% 0}55%,78%{background-position:0 100%}79%,100%{background-position:100% 100%}}@keyframes spriteImpact{0%{opacity:1;transform:translate(-50%,-50%) scale(.72)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.72)}}
    .boss{position:absolute;z-index:4;left:var(--boss-x,78%);top:var(--boss-y,62%);width:min(28vw,430px);aspect-ratio:1/1;transform:translate(-50%,-50%);filter:drop-shadow(0 22px 20px rgba(0,0,0,.42))}.boss-sprite{width:100%;aspect-ratio:1/1;background-image:var(--boss-atlas);background-size:400% 100%;background-repeat:no-repeat;background-position:0 0;transform:scaleX(var(--boss-face,1))}.boss.active .boss-sprite{animation:bossLoop 3.3s steps(1,end) infinite}@keyframes bossLoop{0%,8.9%{background-position:0 0}9%,63.5%{background-position:33.333333% 0}63.6%,100%{background-position:66.666667% 0}}
    .boss-tag{top:-42px;color:#fff2a8;font-size:18px;min-width:220px}.boss-hp{position:absolute;left:50%;top:-12px;width:260px;height:12px;transform:translateX(-50%);border-radius:99px;background:rgba(0,0,0,.58);overflow:hidden}.boss-hp span{display:block;height:100%;width:calc(var(--boss-hp,1)*100%);background:linear-gradient(90deg,var(--red),#ffe77a,var(--cyan));transition:width .2s}
    .boss-command{position:absolute;left:50%;top:28px;z-index:5;min-width:100px;padding:7px 18px;transform:translateX(-50%);text-align:center;color:var(--cyan);font-size:30px;line-height:1;font-weight:900;border:1px solid rgba(101,239,255,.52);border-radius:8px;background:rgba(3,17,26,.86);box-shadow:0 0 18px rgba(101,239,255,.35),inset 0 0 16px rgba(101,239,255,.08);text-shadow:0 0 12px rgba(101,239,255,.88)}.boss-warning{position:absolute;left:50%;top:54%;z-index:8;padding:9px 18px;transform:translate(-50%,-50%);border:2px solid #ff7b4d;border-radius:9px;color:#fff2a8;font-size:24px;font-weight:900;background:rgba(72,18,13,.9);box-shadow:0 0 26px rgba(255,123,77,.75);animation:bossWarning 1.1s ease-out forwards;pointer-events:none}@keyframes bossWarning{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}.boss-strike .boss-sprite{animation:bossStrike .72s ease-out}@keyframes bossStrike{0%{filter:brightness(1)}35%{filter:brightness(1.8) drop-shadow(0 0 24px #ff7b4d)}100%{filter:brightness(1)}}
    .mission{position:absolute;z-index:12;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.48);backdrop-filter:blur(4px)}.mission-card{width:min(720px,92vw);padding:24px;border:1px solid rgba(255,216,110,.5);border-radius:10px;background:rgba(4,18,28,.9);box-shadow:0 26px 80px rgba(0,0,0,.45)}.mission-card h2{margin:0 0 10px;color:#fff2a8}.mission-card p{color:var(--muted);line-height:1.8}.ladder-name-box{display:grid;gap:8px;margin:14px 0}.ladder-name-box label{gap:6px}.ladder-name-box input{height:44px}.ladder-name-box .two{margin-top:2px}

LabShot var(--boss-cycle,4.2s) linear infinite;opacity:0}@keyframes bossLabShot{0%,73%{opacity:0;transform:translateX(30px) scaleX(.35)}78%,90%{opacity:1;transform:translateX(-160px) scaleX(1.35)}91%,100%{opacity:0;transform:translateX(-190px) scaleX(.8)}}.boss-lab-impact{position:absolute;left:17%;bottom:94px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,white 0 12%,var(--weapon-color,#65efff) 13% 45%,transparent 47%);box-shadow:0 0 22px var(--weapon-color,#65efff);animation:bossLabImpact var(--boss-cycle,4.2s) ease-out infinite;opacity:0}@keyframes bossLabImpact{0%,86%{opacity:0;transform:scale(.45)}90%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.9)}}.boss-lab-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.boss-chip{padding:8px;border:1px solid rgba(255,216,110,.28);border-radius:8px;background:rgba(255,216,110,.08);color:#fff2a8;text-align:center;font-weight:900}.boss-option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.boss-option-grid .active{background:linear-gradient(180deg,#ffe77a,#f6bd3a);color:#241a00;border-color:#ffe77a}.boss-lab-weapon-ice{--weapon-color:#65efff;--boss-color:rgba(101,239,255,.5)}.boss-lab-weapon-fire{--weapon-color:#ff7b4d;--boss-color:rgba(255,123,77,.5)}.boss-lab-weapon-thunder{--weapon-color:#ffe66d;--boss-color:rgba(255,230,109,.58)}.boss-lab-weapon-shadow{--weapon-color:#b06cff;--boss-color:rgba(176,108,255,.52)}

<script>
  (() => {
    const missionStartButton = document.getElementById('missionStartBtn');
    if (missionStartButton && typeof window.handleMissionStart === 'function') missionStartButton.onclick = window.handleMissionStart;
    const version = '20260713-boss-facing';
    const refreshBossAtlases = () => document.querySelectorAll('.boss-sprite,.boss-lab-sprite').forEach(node => {
      const image = getComputedStyle(node).backgroundImage;
      const match = image.match(/url\(["']?([^"')]+)["']?\)/);
      if (match && !match[1].includes('?')) node.style.backgroundImage = `url("${match[1]}?v=${version}")`;
    });
    new MutationObserver(refreshBossAtlases).observe(document.body, {childList:true, subtree:true});
    window.addEventListener('load', refreshBossAtlases);
  })();
  (() => {
    const originalFinish = finish;
    finish = win => { battleVisualGeneration++;stopHeroMotion(); originalFinish(win); };
  })();
  document.addEventListener('animationend', event => {
    if(event.animationName === 'bossAttackCue') event.target.closest('.boss')?.classList.remove('boss-strike');
  });
  (() => {
    const originalBoss=boss, originalThreat=bossThreat, originalLab=renderBossLab;
    boss=()=>{originalBoss();BossMotion.mount(document.querySelector('#bossEntity .boss-sprite'),levels[state.levelIndex].id).catch(console.error)};
    bossThreat=()=>{
      const pending=state.bossAttackPending;
      originalThreat();
      if(!pending&&state.bossAttackPending)BossMotion.play(document.querySelector('#bossEntity .boss-sprite'));
    };
    renderBossLab=()=>{originalLab();BossMotion.mount(document.querySelector('.boss-lab-sprite'),levels[bossLabState.levelIndex].id,{loop:true}).catch(console.error)};
    renderBossLab();
  })();
</script>
